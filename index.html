<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiAutoSheet</title>
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  <style>
    .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .main-tab-btn { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
    .main-tab-btn.active { background: #007bff; color: #fff; font-weight: bold; border-color: #007bff; }
    #content-container { min-height: 400px; padding: 12px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <!-- 상단 탭 -->
  <div class="tab-bar">
    <button type="button" class="main-tab-btn active" onclick="switchTab(this, 'semi_auto.html')">세미오토</button>
    <button type="button" class="main-tab-btn" onclick="switchTab(this, 'full_auto.html')">풀오토</button>
    <button type="button" class="main-tab-btn" onclick="switchTab(this, 'recruits.html')">채용시트</button>
  </div>

  <!-- 콘텐츠 영역 -->
  <div id="content-container">페이지를 로딩 중입니다...</div>

  <script>
    async function loadPage(fileUrl) {
      console.log('loadPage 호출됨:', fileUrl);
      const container = document.getElementById('content-container');
      
      if (!container) {
        console.error("오류: #content-container 엘리먼트가 없습니다.");
        return;
      }

      try {
        const response = await fetch('./' + fileUrl);
        console.log('fetch 응답 상태:', response.status);
        
        if (!response.ok) {
          throw new Error(`파일을 불러올 수 없습니다. Status: ${response.status}`);
        }
        
        const html = await response.text();
        container.innerHTML = html;

        // 주입된 script 태그 재실행
        const scripts = Array.from(container.querySelectorAll('script'));
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        console.error('페이지 로드 중 에러 발생:', err);
        container.innerHTML = `<div style="color: red; padding: 20px;">불러오기 실패: ${err.message}</div>`;
      }
    }

    function switchTab(buttonEl, fileUrl) {
      console.log('switchTab 클릭됨:', fileUrl);
      const buttons = document.querySelectorAll('.main-tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      buttonEl.classList.add('active');
      loadPage(fileUrl);
    }

    // DOM 완료 시 초기 실행
    window.addEventListener('DOMContentLoaded', () => {
      console.log('DOMContentLoaded 실행됨');
      loadPage('semi_auto.html');
    });
  </script>
</body>
</html>
