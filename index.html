<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프리코네 공략</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 10px; background: #fff; }
    img { max-width: 100%; height: auto; }
    
    /* 파티 세팅 카드 스타일 */
    .party-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; font-size: 12px; margin-bottom: 15px; }
    .party-card img { width: 100%; border-radius: 4px; }
    
    /* 타임라인 테이블 스타일 */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
    .text-left { text-align: left; }
    
    /* Auto 하이라이트 색상 */
    .auto-on { background-color: #e3f2fd; color: #0d47a1; font-weight: bold; }
    .auto-off { background-color: #ffebee; color: #c62828; font-weight: bold; }
  </style>
</head>
<body>

  <div id="loading">공략 데이터를 불러오는 중...</div>
  <div id="content" style="display:none;">
    <!-- 인트로 이미지 & 원본 링크 -->
    <div id="intro-area"></div>
    
    <!-- 파티 세팅 -->
    <div class="party-grid" id="party-area"></div>
    
    <!-- 타임라인 -->
    <table>
      <thead>
        <tr>
          <th>시간</th>
          <th>내용</th>
          <th>Set</th>
          <th>Auto</th>
        </tr>
      </thead>
      <tbody id="timeline-area"></tbody>
    </table>
  </div>

  <script>
    // 2단계에서 복사한 웹 앱 URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwk3Ol0zODBEr30pG1mXMrt1RymsK9TK3TpuOJKCJCiRuKO5f-0wmfx9rVTzN0H9lu5/exec";

    async function loadGuide() {
      try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();

        // 1. 인트로 이미지 & 원본 링크
        if (data.sourceLink) {
          document.getElementById('intro-area').innerHTML = `<a href="${data.sourceLink}" target="_blank"><img src="${data.introImage}"></a>`;
        } else {
          document.getElementById('intro-area').innerHTML = `<img src="${data.introImage}">`;
        }

        // 2. 파티 세팅
        const partyHTML = data.party.map(p => `
          <div class="party-card">
            <img src="${p.img}">
            <div><b>${p.name}</b></div>
            <div>★ ${p.star}</div>
            <div>RANK ${p.rank}</div>
          </div>
        `).join('');
        document.getElementById('party-area').innerHTML = partyHTML;

        // 3. 타임라인
        const timelineHTML = data.timeline.map(t => {
          const autoClass = t.auto === 'ON' ? 'auto-on' : (t.auto === 'OFF' ? 'auto-off' : '');
          return `
            <tr>
              <td>${t.time}</td>
              <td class="text-left">${t.action}</td>
              <td>${t.set}</td>
              <td class="${autoClass}">${t.auto}</td>
            </tr>
          `;
        }).join('');
        document.getElementById('timeline-area').innerHTML = timelineHTML;

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (err) {
        document.getElementById('loading').innerText = "데이터를 불러오는 데 실패했습니다.";
      }
    }

    loadGuide();
  </script>
</body>
</html>
