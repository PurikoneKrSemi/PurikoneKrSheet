<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프리코네 타임라인 공략 작성기</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --success-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 30px 15px; 
            max-width: 1080px; 
            margin: 0 auto; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            line-height: 1.5;
        }

        h2 { 
            margin-bottom: 20px; 
            font-size: 24px;
            font-weight: 700;
            color: #111827; 
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sticky-container {
            background-color: var(--bg-color);
            padding-top: 5px;
            padding-bottom: 5px;
        }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03); 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color);
        }

        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 8px; }
        
        label { font-weight: 600; font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; }
        
        input[type="text"], select { 
            width: 100%; 
            padding: 8px 12px; 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-size: 14px; 
            text-align: center;
            transition: all 0.2s;
            outline: none;
            background-color: #fafafa;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        
        .party-table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 8px; background: #fff; table-layout: fixed; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        .party-table th, .party-table td { border-bottom: 1px solid var(--border-color); border-right: 1px solid var(--border-color); padding: 6px; text-align: center; font-size: 13px; }
        .party-table tr:last-child td, .party-table tr:last-child th { border-bottom: none; }
        .party-table td:last-child, .party-table th:last-child { border-right: none; }
        .party-table th { background-color: #f9fafb; font-weight: 600; color: var(--text-muted); width: 16.66%; }
        
        .char-img-box { 
            width: 90px; 
            height: 90px; 
            margin: 0 auto; 
            background: #f3f4f6; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            border: 2px dashed #d1d5db; 
            border-radius: 8px;
            position: relative; 
            cursor: pointer; 
            transition: all 0.2s;
        }

        .char-img-box:hover {
            border-color: var(--primary-color);
            background-color: #eef2ff;
        }

        .char-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .char-img-box span { position: absolute; color: var(--text-muted); font-size: 11px; pointer-events: none; text-align: center; font-weight: 500; }

        .party-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .party-header label { margin-bottom: 0; font-size: 15px; color: #111827; }
        
        .btn-toggle-card { background: #f3f4f6; color: var(--text-muted); border: 1px solid var(--border-color); padding: 4px 10px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-toggle-card:hover { background: #e5e7eb; }
        
        .btn-group { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        
        button { 
            cursor: pointer; 
            border: none; 
            padding: 8px 12px; 
            font-weight: 600; 
            border-radius: 6px; 
            transition: all 0.15s ease;
            font-size: 13px;
        }

        button:active { transform: scale(0.97); }
        
        .btn-char { background-color: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; }
        .btn-char:hover { background-color: #e0e7ff; }
        
        .btn-kw { background-color: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        .btn-kw:hover { background-color: #dcfce7; }
        
        .set-toggle { 
            width: 100%; 
            padding: 8px; 
            font-size: 15px; 
            font-weight: 700; 
            border-radius: 6px; 
            border: 1px solid #a7f3d0; 
            background-color: #ecfdf5; 
            color: #047857; 
        }

        .set-toggle.is-x { background-color: #fef2f2; color: #b91c1c; border-color: #fecaca; }

        .btn-action { background-color: var(--primary-color); color: white; font-size: 14px; padding: 9px 18px; }
        .btn-action:hover { background-color: var(--primary-hover); }
        
        .btn-empty { background-color: #4b5563; color: white; font-size: 14px; padding: 9px 15px; }
        .btn-empty:hover { background-color: #374151; }
        
        .btn-update { background-color: var(--warning-color); color: white; font-size: 14px; padding: 9px 18px; display: none; }
        .btn-update:hover { background-color: #d97706; }

        .btn-copy { background-color: var(--success-color); color: white; font-size: 14px; padding: 8px 16px; }
        .btn-copy:hover { background-color: #059669; }

        /* 작성 목록 테이블 스타일 */
        #timeline-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-color); }
        #timeline-table th, #timeline-table td { border-bottom: 1px solid var(--border-color); padding: 10px; text-align: center; font-size: 13px; color: inherit; }
        #timeline-table th { background-color: #f9fafb; color: var(--text-muted); font-weight: 600; }
        #timeline-table td.text-left { text-align: left; }
        #timeline-table tbody tr:hover { background-color: #f9fafb; }
        
        .auto-changed-ON { background-color: #e0f2fe; color: #0369a1; }
        .auto-changed-OFF { background-color: #ffe4e6; color: #be123c; }

        .preview-area { margin-top: 25px; background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .preview-area h3 { font-size: 16px; margin-bottom: 12px; color: #111827; }

        /* 출력 테이블 스타일 - 볼드 제거 */
        .output-table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 13px; color: #000; background: #fff; table-layout: fixed; }
        .output-table td, .output-table th { border: 1px solid #111; padding: 4px 6px; text-align: center; overflow: hidden; color: inherit; font-weight: normal; }
        .output-table .text-left { text-align: left; }
        .output-table .header-link { font-weight: normal; text-align: left; background: #fff; }
        .output-table .header-link a { color: #0056b3; text-decoration: underline; }
        
        .output-table .img-td { padding: 0 !important; vertical-align: middle; width: 16.66%; }
        .output-table .img-td img { width: 100%; height: auto; display: block; object-fit: fill; }
        
        .output-table .th-label { background: #fff; font-weight: normal; }
        .output-table .bg-auto-on { background-color: #80d8ff; }
        .output-table .bg-auto-off { background-color: #ffd8d8; }
        
        /* 볼드 제거하고 빨간색만 적용 */
        .change-x { color: #dc3545; font-weight: normal; }
        .output-table .empty-row-td { height: 24px; }

        /* 모달 팝업 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; max-width: 640px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
        .boss-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 10px; margin-top: 15px; }
        .boss-item { border: 1px solid var(--border-color); border-radius: 8px; padding: 6px; text-align: center; cursor: pointer; transition: all 0.2s; background: #fff; }
        .boss-item:hover { border-color: var(--primary-color); background-color: #eef2ff; transform: translateY(-2px); }
        .boss-item img { width: 100%; height: auto; display: block; border-radius: 4px; }
        .boss-item span { font-size: 11px; color: var(--text-main); margin-top: 4px; display: block; font-weight: 600; }
    </style>
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>🎮 프리코네 타임라인 공략 작성기</h2>
    <button id="reset-btn" onclick="resetAllData()">전체 초기화</button>
    </div>

    <div class="sticky-container">
        <!-- 1. 파티 정보 설정 -->
        <div class="card" style="margin-bottom: 12px;">
            <div class="party-header" onclick="togglePartySection()">
                <label style="cursor: pointer;">파티 및 캐릭터 정보 설정</label>
                <button type="button" class="btn-toggle-card" id="toggle-party-btn">접기 ▲</button>
            </div>
            <div id="party-section-body">
                <table class="party-table">
                    <tbody>
                        <tr>
                            <td colspan="6">
                                <input type="text" id="guide-text" style="text-align: left;" placeholder="표시할 공략 제목" oninput="renderFinalPreview()">
                            </td>
                        </tr>
                        <tr>
                            <td colspan="6">
                                <input type="text" id="guide-url" style="text-align: left;" placeholder="공략 원본 링크 URL (https://...)" oninput="renderFinalPreview()">
                            </td>
                        </tr>
                        <tr>
                            <td>
                                <div class="char-img-box" onclick="openBossModal()">
                                    <span id="boss-label">보스 선택<br>(클릭)</span>
                                    <img id="img-boss" src="" alt="" onerror="this.style.display='none'">
                                </div>
                            </td>
                            <td><div class="char-img-box"><img id="img-c1" src="" alt="" onerror="this.style.display='none'"></div></td>
                            <td><div class="char-img-box"><img id="img-c2" src="" alt="" onerror="this.style.display='none'"></div></td>
                            <td><div class="char-img-box"><img id="img-c3" src="" alt="" onerror="this.style.display='none'"></div></td>
                            <td><div class="char-img-box"><img id="img-c4" src="" alt="" onerror="this.style.display='none'"></div></td>
                            <td><div class="char-img-box"><img id="img-c5" src="" alt="" onerror="this.style.display='none'"></div></td>
                        </tr>
                        <tr>
                            <td><input type="text" id="dmg-input" placeholder="딜량 (예: 44212)" oninput="renderFinalPreview()"></td>
                            <td><input type="text" id="c1" placeholder="1번 캐릭터" oninput="updateCharInfo(1)"></td>
                            <td><input type="text" id="c2" placeholder="2번 캐릭터" oninput="updateCharInfo(2)"></td>
                            <td><input type="text" id="c3" placeholder="3번 캐릭터" oninput="updateCharInfo(3)"></td>
                            <td><input type="text" id="c4" placeholder="4번 캐릭터" oninput="updateCharInfo(4)"></td>
                            <td><input type="text" id="c5" placeholder="5번 캐릭터" oninput="updateCharInfo(5)"></td>
                        </tr>
                        <tr>
                            <th>⭐</th>
                            <td><input type="text" id="star1" value="5" oninput="updateCharInfo(1)"></td>
                            <td><input type="text" id="star2" value="5" oninput="updateCharInfo(2)"></td>
                            <td><input type="text" id="star3" value="5" oninput="updateCharInfo(3)"></td>
                            <td><input type="text" id="star4" value="5" oninput="updateCharInfo(4)"></td>
                            <td><input type="text" id="star5" value="5" oninput="updateCharInfo(5)"></td>
                        </tr>
                        <tr>
                            <th>RANK</th>
                            <td><input type="text" id="rank1" value="42"></td>
                            <td><input type="text" id="rank2" value="42"></td>
                            <td><input type="text" id="rank3" value="42"></td>
                            <td><input type="text" id="rank4" value="42"></td>
                            <td><input type="text" id="rank5" value="42"></td>
                        </tr>
                        <tr>
                            <th>
                                <div style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                                    <span>CR</span>
                                    <button type="button" id="spBtn" onmousedown="addSP(event)" style="font-size: 10px; padding: 2px 4px; background: #e0e7ff; color: #3730a3; border: 1px solid #c7d2fe; border-radius: 4px;">SP추가</button>
                                </div>
                            </th>
                            <td><input type="text" id="cr1" value="15"></td>
                            <td><input type="text" id="cr2" value="15"></td>
                            <td><input type="text" id="cr3" value="15"></td>
                            <td><input type="text" id="cr4" value="15"></td>
                            <td><input type="text" id="cr5" value="15"></td>
                        </tr>
                        <tr>
                            <th>TP</th>
                            <td colspan="5"><input type="text" id="tp-input" value="9.0" oninput="renderFinalPreview()" style="text-align: left; padding-left: 10px;"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2. 입력 및 클릭 패널 -->
        <div class="card" style="margin-bottom: 0;">
            <div style="display: flex; gap: 10px; margin-bottom: 12px;">
                <div style="width: 100px;">
                    <label>시간</label>
                    <input type="text" id="time-input" placeholder="118 (-> 1:18)" style="text-align: left;">
                </div>
                <div style="width: 130px;">
                    <label>시작 (→ 왼쪽)</label>
                    <input type="text" id="start-char-input" placeholder="예: 서로체" style="text-align: left;">
                </div>
                <div style="flex: 1;">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label id="action-input-label">행동 설명 (→ 오른쪽, 입력 시 OX 자동 반영)</label>
                        <button type="button" id="reverse-mode-btn" class="btn-toggle-card" onclick="toggleReverseInputMode()">↔ 반대로 입력</button>
                    </div>
                    <input type="text" id="action-input" placeholder="예: 알조미 알네카 SET 알리스 OFF 오토 OFF" oninput="handleActionInput()" style="text-align: left;">
                </div>
            </div>

            <div style="margin-bottom: 12px;">
                <label>캐릭터 빠르게 추가:</label>
                <div class="btn-group">
                    <button class="btn-char" onclick="addText(document.getElementById('c1').value)">1. <span id="lbl-c1">1번</span></button>
                    <button class="btn-char" onclick="addText(document.getElementById('c2').value)">2. <span id="lbl-c2">2번</span></button>
                    <button class="btn-char" onclick="addText(document.getElementById('c3').value)">3. <span id="lbl-c3">3번</span></button>
                    <button class="btn-char" onclick="addText(document.getElementById('c4').value)">4. <span id="lbl-c4">4번</span></button>
                    <button class="btn-char" onclick="addText(document.getElementById('c5').value)">5. <span id="lbl-c5">5번</span></button>
                </div>
            </div>

            <div style="margin-bottom: 12px;">
                <label>키워드 입력:</label>
                <div class="btn-group">
                    <button class="btn-kw" onclick="addText('→')">→</button>
                    <button class="btn-kw" onclick="addText('SET')">SET</button>
                    <button class="btn-kw" onclick="addText('OFF')">OFF</button>
                    <button class="btn-kw" onclick="addText('오토 ON')">오토 ON</button>
                    <button class="btn-kw" onclick="addText('오토 OFF')">오토 OFF</button>
                    <button class="btn-kw" onclick="addText('※')">※</button>
                    <button class="btn-kw" onclick="addText('보스')">보스</button>
                    <button class="btn-kw" onclick="addText('O')">O</button>
                    <button class="btn-kw" onclick="addText('X')">X</button>
                </div>
            </div>

            <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 12px;">
                <label>각 캐릭터별 Set 상태:</label>
                <div class="grid-5" style="margin-bottom: 12px;">
                    <div><button type="button" class="set-toggle" id="st-0" onclick="toggleSet(0)">O</button></div>
                    <div><button type="button" class="set-toggle" id="st-1" onclick="toggleSet(1)">O</button></div>
                    <div><button type="button" class="set-toggle" id="st-2" onclick="toggleSet(2)">O</button></div>
                    <div><button type="button" class="set-toggle" id="st-3" onclick="toggleSet(3)">O</button></div>
                    <div><button type="button" class="set-toggle" id="st-4" onclick="toggleSet(4)">O</button></div>
                </div>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <label style="margin-bottom: 0;">Auto 상태:</label>
                    <select id="auto-input" style="padding: 6px 10px; width: auto;">
                        <option value="OFF">OFF</option>
                        <option value="ON">ON</option>
                    </select>
                </div>
                <div>
                    <button class="btn-empty" id="empty-btn" onclick="addEmptyRow()">빈 행 / 설명 추가</button>
                    <button class="btn-action" id="add-btn" onclick="addRow()">행 추가</button>
                    <button class="btn-update" id="update-btn" onclick="saveEdit()">수정 완료</button>
                    <button id="cancel-btn" style="display:none; background:#6b7280; color:white; padding:9px 15px;" onclick="cancelEdit()">취소</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 작성 중 목록 -->
    <div class="card" style="margin-top: 15px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <label style="font-size: 15px; color: #111827; margin-bottom: 0;">작성 중 타임라인 목록</label>
            <div style="display: flex; gap: 8px;">
                <button class="btn-copy" onclick="copyToClipboard()">HTML 복사</button>
                <button style="background:#2563eb; color:white;" onclick="openHTMLImportModal()">완성 HTML 붙여넣기</button>
                <button style="background:#ef4444; color:white;" onclick="clearAll()">전체 삭제</button>
            </div>
        </div>

        <table id="timeline-table">
            <thead>
                <tr>
                    <th style="width: 30%;">내용 (1~4열)</th>
                    <th style="width: 15%;">Set (조합)</th>
                    <th style="width: 9%;">Auto</th>
                    <th style="width: 5%;">1</th>
                    <th style="width: 5%;">2</th>
                    <th style="width: 5%;">3</th>
                    <th style="width: 5%;">4</th>
                    <th style="width: 5%;">5</th>
                    <th style="width: 21%;">관리</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <!-- 4. 완성된 HTML 최종 미리보기 구역 (스크롤 내렸을 때 최하단 표시) -->
    <div class="preview-area">
        <h3>최종 출력 미리보기 (완성 형태)</h3>
        <div id="final-html-container"></div>
    </div>

    <!-- 완성 HTML 붙여넣기 모달 -->
    <div class="modal-overlay" id="html-import-modal" onclick="closeHTMLImportModal(event)">
        <div class="modal-content" style="width:min(900px, 92vw);" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="margin:0; font-size:18px;">완성 HTML 붙여넣기</h3>
                <button onclick="closeHTMLImportModal()" style="background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:6px; cursor:pointer;">닫기 ✕</button>
            </div>
            <p style="margin:0 0 8px; color:var(--text-muted); font-size:13px;">
                완성된 웹페이지의 HTML을 그대로 붙여넣으세요. 여러 공략이 들어 있어도 <code>.output-table</code>을 찾아 원하는 공략을 선택할 수 있습니다.
            </p>
            <textarea id="html-import-textarea" rows="14" style="width:100%; box-sizing:border-box; resize:vertical; font-family:monospace; font-size:12px; padding:10px; border:1px solid var(--border-color); border-radius:6px;" placeholder="완성된 HTML 코드를 여기에 붙여넣으세요."></textarea>
            <div id="html-import-selection" style="display:none; margin-top:10px;">
                <label style="display:block; margin-bottom:6px;">불러올 공략 선택</label>
                <select id="html-import-table-select" style="width:100%; padding:8px; border:1px solid var(--border-color); border-radius:6px;"></select>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:10px;">
                <button type="button" style="background:#6b7280; color:white;" onclick="closeHTMLImportModal()">취소</button>
                <button type="button" style="background:#2563eb; color:white;" onclick="importPastedHTML()">HTML 분석 및 불러오기</button>
            </div>
        </div>
    </div>

    <!-- 보스 이미지 선택 모달 창 -->
    <div class="modal-overlay" id="boss-modal" onclick="closeBossModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h3 style="margin:0; font-size: 18px;">보스 선택</h3>
                <button onclick="closeBossModal()" style="background:#ef4444; color:white; border:none; padding:4px 10px; border-radius:6px; cursor:pointer;">닫기 ✕</button>
            </div>
            <div class="boss-grid" id="boss-grid-container">
            </div>
        </div>
    </div>

    <script>
        let editingRow = null;
        let selectedBossName = "";
        let reverseInputMode = false;

        const GITHUB_OWNER = "PurikoneKrSemi";
        const GITHUB_REPO = "SemiAutoSheet";
        const GITHUB_PATH = "images/Boss";

        const GITHUB_IMAGE_BASE = "https://raw.githubusercontent.com/PurikoneKrSemi/SemiAutoSheet/main/images/";
        const GITHUB_BOSS_IMAGE_BASE = `https://raw.githubusercontent.com/PurikoneKrSemi/SemiAutoSheet/main/${GITHUB_PATH}/`;

        async function initBossModal() {
            const container = document.getElementById('boss-grid-container');
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 10px;">보스 목록을 불러오는 중...</div>';

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) {
                    throw new Error(`GitHub API 호출 실패 (Status: ${response.status})`);
                }

                const files = await response.json();
                container.innerHTML = '';

                // 공백 옵션 (이미지 미선택)
                const blankItem = document.createElement('div');
                blankItem.className = 'boss-item';
                blankItem.onclick = () => selectBoss("", "");
                blankItem.innerHTML = `<div style="height: 60px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); font-weight: bold;">없음 (공백)</div>`;
                container.appendChild(blankItem);

                const imageFiles = files.filter(file => file.type === 'file' && /\.(png|jpe?g|webp)$/i.test(file.name));

                if (imageFiles.length === 0) {
                    container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">이미지 파일이 없습니다.</div>';
                    return;
                }

                imageFiles.forEach(file => {
                    const bossName = file.name.replace(/\.[^/.]+$/, "");
                    const rawImgUrl = file.download_url;

                    const item = document.createElement('div');
                    item.className = 'boss-item';
                    item.onclick = () => selectBoss(bossName, rawImgUrl);
                    item.innerHTML = `
                        <img src="${rawImgUrl}" alt="${bossName}">
                        <span>${bossName}</span>
                    `;
                    container.appendChild(item);
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #ef4444; padding: 10px;">보스 이미지 목록을 불러오지 못했습니다.</div>';
            }
        }

        function openBossModal() {
            document.getElementById('boss-modal').style.display = 'flex';
        }

        function closeBossModal(e) {
            document.getElementById('boss-modal').style.display = 'none';
        }

        function selectBoss(bossName, imgUrl) {
            const isBlank = (!bossName && !imgUrl);
            selectedBossName = bossName;
            const imgEl = document.getElementById('img-boss');
            const lblEl = document.getElementById('boss-label');

            if (!isBlank) {
                imgEl.src = imgUrl || `${GITHUB_BOSS_IMAGE_BASE}${bossName}.png`;
                imgEl.style.display = 'block';
                lblEl.style.display = 'none';
            } else {
                imgEl.src = '';
                imgEl.style.display = 'none';
                lblEl.style.display = 'block';
            }

            closeBossModal();
            renderFinalPreview();
        }

        function togglePartySection() {
            const body = document.getElementById('party-section-body');
            const btn = document.getElementById('toggle-party-btn');
            if (body.style.display === 'none') {
                body.style.display = 'block';
                btn.innerText = '접기 ▲';
            } else {
                body.style.display = 'none';
                btn.innerText = '펴기 ▼';
            }
        }

        function updateCharInfo(index) {
            const charName = document.getElementById(`c${index}`).value.trim();
            const star = document.getElementById(`star${index}`).value.trim();
            const imgEl = document.getElementById(`img-c${index}`);
            const lblEl = document.getElementById(`lbl-c${index}`);

            lblEl.innerText = charName || `${index}번`;

            if (charName && star) {
                const fileName = `${charName}${star}.png`;
                imgEl.src = GITHUB_IMAGE_BASE + encodeURIComponent(fileName);
                imgEl.style.display = 'block';
            } else {
                imgEl.src = '';
                imgEl.style.display = 'none';
            }
            renderFinalPreview();
        }

        // 마지막으로 포커스했던 입력칸을 기억한다.
        // 키워드/캐릭터 버튼을 누르면 버튼으로 포커스가 이동할 수 있기 때문에,
        // 실제로 내용을 입력하던 칸을 기억해 두었다가 그곳에 삽입한다.
        let lastTextInputId = 'action-input';

        document.addEventListener('focusin', (event) => {
            const id = event.target?.id;
            if (id === 'time-input' || id === 'start-char-input' || id === 'action-input') {
                lastTextInputId = id;
            }
        });

        function addText(text) {
            // 시작 칸을 마지막으로 사용했다면 시작 칸에,
            // 그 외에는 마지막으로 포커스했던 입력칸에 넣는다.
            let targetId = lastTextInputId || 'action-input';

            const input = document.getElementById(targetId);
            if (!input) return;

            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? input.value.length;
            const before = input.value.slice(0, start);
            const after = input.value.slice(end);

            // 단어/키워드 사이가 붙지 않도록 필요한 경우 공백을 자동으로 넣는다.
            const isOX = ['O', 'X'].includes(text);

            const needsSpaceBefore =
                before.length > 0 &&
                !/\s$/.test(before) &&
                !['→', '※'].includes(text) &&
                !isOX;

            const insertText =
                (needsSpaceBefore ? ' ' : '') +
                text +
                (isOX ? '' : ' ');
            input.value = before + insertText + after;

            const cursorPos = before.length + insertText.length;
            input.focus();
            input.setSelectionRange(cursorPos, cursorPos);

            if (targetId === 'action-input') {
                handleActionInput();
            }
        }

        function toggleSet(index, forceVal = null) {
            const btn = document.getElementById(`st-${index}`);
            const targetVal = forceVal !== null ? forceVal : (btn.innerText === 'O' ? 'X' : 'O');
            btn.innerText = targetVal;
            if (targetVal === 'X') btn.classList.add('is-x');
            else btn.classList.remove('is-x');
        }

        function getCurrentSetStates() {
            return [0, 1, 2, 3, 4].map(i =>
                document.getElementById(`st-${i}`).innerText
            );
        }

        function setCurrentSetStates(states) {
            states.forEach((state, index) => toggleSet(index, state));
        }

        function getPreviousTimelineState() {
            const rows = document.querySelectorAll('#timeline-table tbody tr');

            // 현재 타임라인의 가장 마지막 정상 행을 기준으로
            // SET 상태와 Auto 상태를 함께 가져온다.
            for (let i = rows.length - 1; i >= 0; i--) {
                const tr = rows[i];
                if (tr.dataset.rowType !== 'normal') continue;

                const tds = tr.querySelectorAll('td');
                return {
                    setStates: [0, 1, 2, 3, 4].map(index =>
                        tds[3 + index].textContent.trim().toUpperCase()
                    ),
                    autoVal: (tds[2]?.textContent.trim().toUpperCase() || 'OFF')
                };
            }

            // 정상 행이 아직 없다면 최초 상태는 전원 SET + Auto OFF로 간주한다.
            return {
                setStates: ['O', 'O', 'O', 'O', 'O'],
                autoVal: 'OFF'
            };
        }

        // 기존 함수명도 다른 코드에서 사용할 수 있으므로 유지한다.
        function getPreviousTimelineSetStates() {
            return getPreviousTimelineState().setStates;
        }

        function buildReverseAction(prevStates, currentStates) {
            const chars = [1, 2, 3, 4, 5].map(i =>
                document.getElementById(`c${i}`).value.trim() || `${i}번`
            );

            const setNames = [];
            const offNames = [];

            currentStates.forEach((state, index) => {
                if (state === prevStates[index]) return;

                if (state === 'O') {
                    setNames.push(chars[index]);
                } else {
                    offNames.push(chars[index]);
                }
            });

            const parts = [];
            if (setNames.length) parts.push(`${setNames.join(' ')} SET`);
            if (offNames.length) parts.push(`${offNames.join(' ')} OFF`);

            return parts.join(' ');
        }

        function toggleReverseInputMode() {
            reverseInputMode = !reverseInputMode;

            const label = document.getElementById('action-input-label');
            const input = document.getElementById('action-input');
            const btn = document.getElementById('reverse-mode-btn');

            if (reverseInputMode) {
                label.innerText = 'SET 상태 (O/X 5글자, 필요하면 오토 ON/OFF도 입력)';
                input.placeholder = '예: OOOXX 또는 OOOXX 오토 ON';
                input.removeAttribute('maxLength');
                input.style.fontFamily = 'monospace';
                input.style.letterSpacing = '4px';
                btn.innerText = '↔ 행동 설명 입력';
                btn.style.background = '#dbeafe';
                btn.style.color = '#1d4ed8';
            } else {
                label.innerText = '행동 설명 (→ 오른쪽, 입력 시 OX 자동 반영)';
                input.placeholder = '예: 알조미 알네카 SET 알리스 OFF 오토 OFF';
                input.removeAttribute('maxLength');
                input.style.fontFamily = '';
                input.style.letterSpacing = '';
                btn.innerText = '↔ 반대로 입력';
                btn.style.background = '';
                btn.style.color = '';
            }

            input.value = '';
            input.focus();
        }

        function handleActionInput() {
            if (reverseInputMode) {
                autoParseReverseSet();
            } else {
                autoParseText();
            }
        }

        function autoParseReverseSet() {
            const input = document.getElementById('action-input');
            const text = input.value;

            // 입력 중 O/X 5글자를 발견하면 아래 SET 버튼을 즉시 갱신한다.
            const setMatch = text.toUpperCase().match(/[OX]{5}/);
            if (setMatch) {
                setCurrentSetStates(setMatch[0].split(''));
            }

            // 'OOOXX 오토 ON'처럼 SET 상태와 Auto를 한 칸에 함께 입력할 수 있다.
            const autoMatch = text.match(/오토\s*(ON|OFF)/i);
            if (autoMatch) {
                document.getElementById('auto-input').value = autoMatch[1].toUpperCase();
            }
        }

        function formatTimeInput(rawTime) {
            let t = rawTime.trim();
            if (!t) return '';
            if (t.includes(':')) return t;
            if (/^\d+$/.test(t)) {
                if (t.length === 1) return `0:0${t}`;
                if (t.length === 2) return `0:${t}`;
                if (t.length === 3) return `${t[0]}:${t.slice(1)}`;
                if (t.length === 4) return `${t.slice(0, 2)}:${t.slice(2)}`;
            }
            return t;
        }

        function autoParseText() {
            const text = document.getElementById('action-input').value;
            if (!text.trim()) return;

            const chars = [
                document.getElementById('c1').value.trim(),
                document.getElementById('c2').value.trim(),
                document.getElementById('c3').value.trim(),
                document.getElementById('c4').value.trim(),
                document.getElementById('c5').value.trim()
            ];

            const pattern = /([가-힣a-zA-Z0-9\s]+?)(셋|오프|SET|OFF)/g;
            let match;

            while ((match = pattern.exec(text)) !== null) {
                const targetText = match[1];
                const action = match[2];
                const targetState = (action === '오프' || action === 'OFF') ? 'X' : 'O';

                chars.forEach((charName, index) => {
                    if (charName && targetText.includes(charName)) {
                        toggleSet(index, targetState);
                    }
                });
            }

            if (text.includes('오토 ON') || text.includes('오토ON')) {
                document.getElementById('auto-input').value = 'ON';
            } else if (text.includes('오토 OFF') || text.includes('오토OFF') || text.includes('오토X')) {
                document.getElementById('auto-input').value = 'OFF';
            }
        }

        function getCombinedAction() {
            const start = document.getElementById('start-char-input').value.trim();
            const desc = document.getElementById('action-input').value.trim();
            if (start && desc) return `${start} → ${desc}`;
            if (start && !desc) return start;
            return desc;
        }

        function splitActionIntoFields(storedAction) {
            const text = storedAction || '';
            const arrowIdx = text.indexOf('→');
            if (arrowIdx !== -1) {
                document.getElementById('start-char-input').value = text.slice(0, arrowIdx).trim();
                document.getElementById('action-input').value = text.slice(arrowIdx + 1).trim();
            } else {
                document.getElementById('start-char-input').value = '';
                document.getElementById('action-input').value = text;
            }
        }

        function addEmptyRow() {
            const rawTime = document.getElementById('time-input').value;
            const time = formatTimeInput(rawTime);
            const action = getCombinedAction();
            const fullContent = time ? `${time} ${action}` : action;

            const tbody = document.querySelector('#timeline-table tbody');
            const tr = document.createElement('tr');
            
            if (!fullContent) {
                tr.dataset.rowType = "empty";
                tr.innerHTML = `
                    <td class="text-left" data-time="" data-action="">(빈 행)</td>
                    <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    <td>
                        <button style="background:#f59e0b; color:white; padding:4px 8px;" onclick="startEdit(this)">수정</button>
                        <button style="background:#6b7280; color:white; padding:4px 8px;" onclick="removeRow(this)">삭제</button>
                    </td>
                `;
            } else {
                tr.dataset.rowType = "note";
                tr.innerHTML = `
                    <td class="text-left" data-time="${time}" data-action="${action}">${fullContent}</td>
                    <td>(설명행)</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    <td>
                        <button style="background:#f59e0b; color:white; padding:4px 8px;" onclick="startEdit(this)">수정</button>
                        <button style="background:#6b7280; color:white; padding:4px 8px;" onclick="removeRow(this)">삭제</button>
                    </td>
                `;
            }

            tbody.appendChild(tr);
            recalculateChanges();

            document.getElementById('time-input').value = '';
            document.getElementById('start-char-input').value = '';
            document.getElementById('action-input').value = '';
        }

        function addRow() {
            const rawTime = document.getElementById('time-input').value;
            const time = formatTimeInput(rawTime);
            const autoVal = document.getElementById('auto-input').value;

            let action;
            let currentSet;

            if (reverseInputMode) {
                const reverseText = document.getElementById('action-input').value;
                const setMatch = reverseText.toUpperCase().match(/[OX]{5}/);
                const setInput = setMatch ? setMatch[0] : '';

                if (!/^[OX]{5}$/.test(setInput)) {
                    alert('반대로 입력할 때는 SET 상태 O/X 5글자를 입력해주세요.\n필요하면 뒤에 오토 ON 또는 오토 OFF를 함께 입력할 수 있습니다.\n예: OOOXX 오토 ON');
                    return;
                }

                currentSet = setInput.split('');
                setCurrentSetStates(currentSet);

                const prevState = getPreviousTimelineState();
                const generatedAction = buildReverseAction(
                    prevState.setStates,
                    currentSet
                );

                // SET 상태와 마찬가지로 Auto도 이전 정상 행과 비교한다.
                // 바뀌었을 때만 "오토 ON/OFF"를 행동 설명에 추가한다.
                const autoAction =
                    autoVal !== prevState.autoVal
                        ? `오토 ${autoVal}`
                        : '';

                const generatedParts = [];
                if (generatedAction) generatedParts.push(generatedAction);
                if (autoAction) generatedParts.push(autoAction);

                action = generatedParts.join(' ');

                const start = document.getElementById('start-char-input').value.trim();
                if (start && action) {
                    action = `${start} → ${action}`;
                } else if (start) {
                    action = start;
                }
            } else {
                action = getCombinedAction();
                currentSet = getCurrentSetStates();
            }

            if (!action && !reverseInputMode) {
                alert('행동 내용을 입력해주세요.');
                return;
            }

            const fullContent = time ? `${time} ${action}` : action;

            const tbody = document.querySelector('#timeline-table tbody');
            const tr = document.createElement('tr');
            tr.dataset.rowType = "normal";

            tr.innerHTML = `
                <td class="text-left" data-time="${time}" data-action="${action}">${fullContent}</td>
                <td style="letter-spacing: 2px;"></td>
                <td>${autoVal}</td>
                <td>${currentSet[0]}</td>
                <td>${currentSet[1]}</td>
                <td>${currentSet[2]}</td>
                <td>${currentSet[3]}</td>
                <td>${currentSet[4]}</td>
                <td>
                    <button style="background:#f59e0b; color:white; padding:4px 8px;" onclick="startEdit(this)">수정</button>
                    <button style="background:#6b7280; color:white; padding:4px 8px;" onclick="removeRow(this)">삭제</button>
                </td>
            `;

            tbody.appendChild(tr);
            recalculateChanges();

            document.getElementById('time-input').value = '';
            document.getElementById('start-char-input').value = '';
            document.getElementById('action-input').value = '';
        }


        function startEdit(btn) {
            editingRow = btn.closest('tr');
            const tds = editingRow.querySelectorAll('td');

            if (editingRow.dataset.rowType === "empty") {
                document.getElementById('time-input').value = '';
                document.getElementById('start-char-input').value = '';
                document.getElementById('action-input').value = '';
            } else {
                document.getElementById('time-input').value = tds[0].dataset.time || '';
                splitActionIntoFields(tds[0].dataset.action || '');
                
                if (editingRow.dataset.rowType === "normal") {
                    document.getElementById('auto-input').value = tds[2].innerText.trim() || 'OFF';
                    for (let i = 0; i < 5; i++) {
                        const rawText = tds[3 + i].textContent.trim();
                        toggleSet(i, rawText);
                    }
                }
            }

            document.getElementById('add-btn').style.display = 'none';
            document.getElementById('empty-btn').style.display = 'none';
            document.getElementById('update-btn').style.display = 'inline-block';
            document.getElementById('cancel-btn').style.display = 'inline-block';
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function saveEdit() {
            if (!editingRow) return;

            const rawTime = document.getElementById('time-input').value;
            const time = formatTimeInput(rawTime);
            const action = getCombinedAction();
            const autoVal = document.getElementById('auto-input').value;
            const tds = editingRow.querySelectorAll('td');

            if (editingRow.dataset.rowType === "empty") {
                if (!action) {
                    tds[0].innerHTML = "(빈 행)";
                } else {
                    editingRow.dataset.rowType = "note";
                    const fullContent = time ? `${time} ${action}` : action;
                    tds[0].innerHTML = fullContent;
                    tds[0].dataset.time = time;
                    tds[0].dataset.action = action;
                    tds[1].innerText = "(설명행)";
                }
            } else if (editingRow.dataset.rowType === "note") {
                const fullContent = time ? `${time} ${action}` : action;
                tds[0].innerHTML = fullContent || "(빈 행)";
                tds[0].dataset.time = time;
                tds[0].dataset.action = action;
                if (!fullContent) editingRow.dataset.rowType = "empty";
            } else {
                const fullContent = time ? `${time} ${action}` : action;
                tds[0].innerHTML = fullContent;
                tds[0].dataset.time = time;
                tds[0].dataset.action = action;
                tds[2].innerText = autoVal;

                for (let i = 0; i < 5; i++) {
                    tds[3 + i].innerText = document.getElementById(`st-${i}`).innerText;
                }
            }

            recalculateChanges();
            cancelEdit();
        }

        function cancelEdit() {
            editingRow = null;
            document.getElementById('time-input').value = '';
            document.getElementById('start-char-input').value = '';
            document.getElementById('action-input').value = '';
            document.getElementById('add-btn').style.display = 'inline-block';
            document.getElementById('empty-btn').style.display = 'inline-block';
            document.getElementById('update-btn').style.display = 'none';
            document.getElementById('cancel-btn').style.display = 'none';
        }

        function removeRow(btn) {
            btn.closest('tr').remove();
            recalculateChanges();
        }

        function recalculateChanges() {
            const rows = document.querySelectorAll('#timeline-table tbody tr');
            let prevStates = null;
            let prevAuto = null;

            rows.forEach(tr => {
                if (tr.dataset.rowType !== "normal") {
                    return;
                }

                const tds = tr.querySelectorAll('td');
                const currentSet = [];
                for (let i = 0; i < 5; i++) {
                    currentSet.push(tds[3 + i].textContent.trim());
                }

                let combinedHTML = "";
                for (let i = 0; i < 5; i++) {
                    const char = currentSet[i];
                    const isChanged = prevStates && (prevStates[i] !== char);
                    
                    if (isChanged) {
                        combinedHTML += `<span class="change-x">${char}</span>`;
                        tds[3 + i].innerHTML = `<span class="change-x">${char}</span>`;
                    } else {
                        combinedHTML += char;
                        tds[3 + i].innerText = char;
                    }
                }
                tds[1].innerHTML = combinedHTML;
                prevStates = [...currentSet];

                const currentAuto = tds[2].textContent.trim();
                if (prevAuto !== null && prevAuto !== currentAuto) {
                    tds[2].className = `auto-changed-${currentAuto}`;
                } else {
                    tds[2].className = '';
                }
                prevAuto = currentAuto;
            });

            renderFinalPreview();
        }

        function buildFinalHTML() {
            const guideText = document.getElementById('guide-text').value.trim() || '공략 타임라인';
            const guideUrl = document.getElementById('guide-url').value.trim();
            const dmg = document.getElementById('dmg-input').value.trim();
            const tpVal = document.getElementById('tp-input').value.trim();
            const tpText = tpVal ? (tpVal.toUpperCase().startsWith('TP') ? tpVal : `TP ${tpVal}`) : 'TP';

            const headerContent = guideUrl ? `<a href="${guideUrl}" target="_blank">${guideText}</a>` : guideText;
            const bossImgSrc = document.getElementById('img-boss').src;

            const chars = [];
            for (let i = 1; i <= 5; i++) {
                chars.push({
                    name: document.getElementById(`c${i}`).value.trim(),
                    star: document.getElementById(`star${i}`).value.trim(),
                    rank: document.getElementById(`rank${i}`).value.trim(),
                    cr: document.getElementById(`cr${i}`).value.trim(),
                    imgSrc: document.getElementById(`img-c${i}`).src
                });
            }

            const rows = document.querySelectorAll('#timeline-table tbody tr');
            let timelineRows = '';
            let prevStates = null;
            let prevAuto = null;

            rows.forEach((tr) => {
                const type = tr.dataset.rowType;
                
                if (type === "empty") {
                    timelineRows += `
                    <tr>
                        <td colspan="4" class="text-left empty-row-td"></td>
                        <td></td>
                        <td></td>
                    </tr>`;
                } else if (type === "note") {
                    const tds = tr.querySelectorAll('td');
                    const textContent = tds[0].innerHTML;
                    timelineRows += `
                    <tr>
                        <td colspan="6" class="text-left">${textContent}</td>
                    </tr>`;
                } else {
                    const tds = tr.querySelectorAll('td');
                    const textContent = tds[0].innerHTML;
                    const autoContent = tds[2].textContent.trim();

                    let autoBgClass = '';
                    if (prevAuto !== null && prevAuto !== autoContent) {
                        autoBgClass = autoContent === 'ON' ? 'bg-auto-on' : 'bg-auto-off';
                    }

                    const currentSet = [];
                    for (let i = 0; i < 5; i++) {
                        currentSet.push(tds[3 + i].textContent.trim());
                    }

                    let setContent = "";
                    for (let i = 0; i < 5; i++) {
                        const char = currentSet[i];
                        const isChanged = prevStates && (prevStates[i] !== char);
                        if (isChanged) {
                            setContent += `<span class="change-x">${char}</span>`;
                        } else {
                            setContent += char;
                        }
                    }

                    timelineRows += `
                    <tr>
                        <td colspan="4" class="text-left">${textContent}</td>
                        <td>${setContent}</td>
                        <td class="${autoBgClass}">${autoContent}</td>
                    </tr>`;

                    prevStates = [...currentSet];
                    prevAuto = autoContent;
                }
            });

            return `
<table class="output-table">
    <colgroup>
        <col style="width: 16.66%;">
        <col style="width: 16.66%;">
        <col style="width: 16.66%;">
        <col style="width: 16.66%;">
        <col style="width: 16.66%;">
        <col style="width: 16.66%;">
    </colgroup>
    <thead>
        <tr>
            <th colspan="6" class="header-link">${headerContent}</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td class="img-td">${(bossImgSrc && !bossImgSrc.endsWith('undefined')) ? `<img src="${bossImgSrc}">` : ''}</td>
            ${chars.map(c => `<td class="img-td">${(c.imgSrc && !c.imgSrc.endsWith('undefined') && c.name) ? `<img src="${c.imgSrc}">` : ''}</td>`).join('')}
        </tr>
        <tr>
            <td>${dmg}</td>
            ${chars.map(c => `<td>${c.name}</td>`).join('')}
        </tr>
        <tr>
            <td class="th-label">⭐</td>
            ${chars.map(c => `<td>${c.star}</td>`).join('')}
        </tr>
        <tr>
            <td class="th-label">RANK</td>
            ${chars.map(c => `<td>${c.rank}</td>`).join('')}
        </tr>
        <tr>
            <td class="th-label">CR</td>
            ${chars.map(c => `<td>${c.cr}</td>`).join('')}
        </tr>
        <tr>
            <td colspan="4" class="text-left">${tpText}</td>
            <td>Set</td>
            <td>Auto</td>
        </tr>
        ${timelineRows}
    </tbody>
</table>`.trim();
        }

        function renderFinalPreview() {
            const container = document.getElementById('final-html-container');
            container.innerHTML = buildFinalHTML();
            saveToLocalStorage();
        }

        // 현재 작성 중인 내용을 로컬스토리지에 저장하는 함수
        function serializeTimelineRows() {
            const rows = document.querySelectorAll('#timeline-table tbody tr');
            return Array.from(rows).map(tr => {
                const tds = tr.querySelectorAll('td');
                const rowType = tr.dataset.rowType;
                const data = {
                    rowType: rowType,
                    time: tds[0].dataset.time || '',
                    action: tds[0].dataset.action || ''
                };
                if (rowType === 'normal') {
                    data.autoVal = tds[2].textContent.trim();
                    data.setStates = [0, 1, 2, 3, 4].map(i => tds[3 + i].textContent.trim());
                }
                return data;
            });
        }

        function createTimelineRow(data) {
            const tr = document.createElement('tr');
            tr.dataset.rowType = data.rowType;
            const fullContent = data.time ? `${data.time} ${data.action}` : data.action;

            if (data.rowType === 'empty') {
                tr.innerHTML = `
                    <td class="text-left" data-time="" data-action="">(빈 행)</td>
                    <td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    <td>
                        <button style="background:#f59e0b; color:white; padding:4px 8px;" onclick="startEdit(this)">수정</button>
                        <button style="background:#6b7280; color:white; padding:4px 8px;" onclick="removeRow(this)">삭제</button>
                    </td>
                `;
            } else if (data.rowType === 'note') {
                tr.innerHTML = `
                    <td class="text-left" data-time="${data.time}" data-action="${data.action}">${fullContent}</td>
                    <td>(설명행)</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td>
                    <td>
                        <button style="background:#f59e0b; color:white; padding:4px 8px;" onclick="startEdit(this)">수정</button>
                        <button style="background:#6b7280; color:white; padding:4px 8px;" onclick="removeRow(this)">삭제</button>
                    </td>
                `;
            } else {
                const setStates = data.setStates || ['O', 'O', 'O', 'O', 'O'];
                tr.innerHTML = `
                    <td class="text-left" data-time="${data.time}" data-action="${data.action}">${fullContent}</td>
                    <td style="letter-spacing: 2px;"></td>
                    <td>${data.autoVal || 'OFF'}</td>
                    <td>${setStates[0]}</td>
                    <td>${setStates[1]}</td>
                    <td>${setStates[2]}</td>
                    <td>${setStates[3]}</td>
                    <td>${setStates[4]}</td>
                    <td>
                        <button style="background:#f59e0b; color:white; padding:4px 8px;" onclick="startEdit(this)">수정</button>
                        <button style="background:#6b7280; color:white; padding:4px 8px;" onclick="removeRow(this)">삭제</button>
                    </td>
                `;
            }
            return tr;
        }

        function saveToLocalStorage() {
            const chars = [];
            for (let i = 1; i <= 5; i++) {
                chars.push({
                    name: document.getElementById(`c${i}`).value,
                    star: document.getElementById(`star${i}`).value,
                    rank: document.getElementById(`rank${i}`).value,
                    cr: document.getElementById(`cr${i}`).value
                });
            }

            const state = {
                guideText: document.getElementById('guide-text').value,
                guideUrl: document.getElementById('guide-url').value,
                dmg: document.getElementById('dmg-input').value,
                tp: document.getElementById('tp-input').value,
                selectedBossName: selectedBossName,
                bossImgSrc: document.getElementById('img-boss').src,
                chars: chars,
                timelineRows: serializeTimelineRows()
            };
            localStorage.setItem('priconne_timeline_builder_data', JSON.stringify(state));
        }

        // 로컬스토리지에서 저장된 작성 중이던 내용을 불러오는 함수
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('priconne_timeline_builder_data');
            if (!saved) return;

            try {
                const state = JSON.parse(saved);

                if (state.guideText !== undefined) document.getElementById('guide-text').value = state.guideText;
                if (state.guideUrl !== undefined) document.getElementById('guide-url').value = state.guideUrl;
                if (state.dmg !== undefined) document.getElementById('dmg-input').value = state.dmg;
                if (state.tp !== undefined) document.getElementById('tp-input').value = state.tp;

                if (state.selectedBossName !== undefined) selectedBossName = state.selectedBossName;
                if (state.bossImgSrc) {
                    const imgEl = document.getElementById('img-boss');
                    const lblEl = document.getElementById('boss-label');
                    imgEl.src = state.bossImgSrc;
                    imgEl.style.display = 'block';
                    lblEl.style.display = 'none';
                }

                if (state.chars) {
                    state.chars.forEach((c, idx) => {
                        const i = idx + 1;
                        if (c.name !== undefined) document.getElementById(`c${i}`).value = c.name;
                        if (c.star !== undefined) document.getElementById(`star${i}`).value = c.star;
                        if (c.rank !== undefined) document.getElementById(`rank${i}`).value = c.rank;
                        if (c.cr !== undefined) document.getElementById(`cr${i}`).value = c.cr;
                        updateCharInfo(i);
                    });
                }

                if (state.timelineRows && state.timelineRows.length > 0) {
                    const tbody = document.querySelector('#timeline-table tbody');
                    tbody.innerHTML = '';
                    state.timelineRows.forEach(rowData => {
                        tbody.appendChild(createTimelineRow(rowData));
                    });
                    recalculateChanges();
                }
            } catch (e) {
                console.error('로컬스토리지 데이터 로드 실패:', e);
            }
        }

        // 완성된 HTML을 텍스트로 붙여넣어 불러온다.
        let pastedHTMLTables = [];

        function openHTMLImportModal() {
            document.getElementById('html-import-modal').style.display = 'flex';
            document.getElementById('html-import-textarea').focus();
        }

        function closeHTMLImportModal(e) {
            if (e && e.target !== document.getElementById('html-import-modal')) return;
            document.getElementById('html-import-modal').style.display = 'none';
        }

        function importPastedHTML() {
            const htmlText = document.getElementById('html-import-textarea').value.trim();
            if (!htmlText) {
                alert('완성 HTML 코드를 붙여넣어 주세요.');
                return;
            }

            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                pastedHTMLTables = Array.from(doc.querySelectorAll('table.output-table'));

                if (pastedHTMLTables.length === 0) {
                    alert('class="output-table"인 공략 테이블을 찾지 못했습니다.\n\n웹페이지의 <table class="output-table"> 부분을 포함해서 붙여넣어 주세요.');
                    return;
                }

                const selectWrap = document.getElementById('html-import-selection');
                const select = document.getElementById('html-import-table-select');
                select.innerHTML = '';

                pastedHTMLTables.forEach((table, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    const link = table.querySelector('thead .header-link a');
                    const title = (link?.textContent || table.querySelector('thead')?.textContent || `공략 ${index + 1}`).trim().replace(/\s+/g, ' ');
                    option.textContent = `${index + 1}. ${title.slice(0, 150)}`;
                    select.appendChild(option);
                });

                if (pastedHTMLTables.length > 1) {
                    selectWrap.style.display = 'block';
                    const selectedIndex = Number(select.value);
                    // 이미 선택 목록이 표시된 상태에서 버튼을 다시 누르면
                    // 현재 선택된 공략만 입력기로 가져온다.
                    if (select.dataset.ready === '1') {
                        importCompletedHTML(htmlText, pastedHTMLTables[selectedIndex]);
                        closeHTMLImportModal();
                        select.dataset.ready = '0';
                        return;
                    }
                    select.dataset.ready = '1';
                    alert(`${pastedHTMLTables.length}개의 공략을 찾았습니다.\n\n불러올 공략을 선택한 뒤 "HTML 분석 및 불러오기"를 다시 눌러주세요.`);
                    return;
                }

                importCompletedHTML(htmlText, pastedHTMLTables[0]);
                closeHTMLImportModal();
            } catch (error) {
                console.error('HTML 분석 실패:', error);
                alert('HTML을 분석하는 중 오류가 발생했습니다.\n\n' + error.message);
            }
        }

        function importCompletedHTML(htmlText, selectedTable = null) {
            const parser = new DOMParser();
            const doc = parser.parseFromString(htmlText, 'text/html');
            const table = selectedTable || doc.querySelector('.output-table');

            if (!table) {
                throw new Error('class="output-table"인 출력 테이블을 찾지 못했습니다.');
            }

            if (!confirm('현재 입력기에서 작성 중인 내용이 새 HTML 내용으로 교체됩니다.\n계속하시겠습니까?')) {
                return;
            }

            // 현재 편집 상태 초기화
            cancelEdit();

            const tbody = table.querySelector('tbody');
            if (!tbody) {
                throw new Error('출력 테이블의 <tbody>를 찾지 못했습니다.');
            }

            const bodyRows = Array.from(tbody.children).filter(el => el.tagName === 'TR');

            // 1) 공략 제목/URL
            const headerLink = table.querySelector('thead .header-link a');
            const headerCell = table.querySelector('thead .header-link');

            if (headerLink) {
                document.getElementById('guide-text').value = headerLink.textContent.trim();
                document.getElementById('guide-url').value = headerLink.getAttribute('href') || '';
            } else if (headerCell) {
                document.getElementById('guide-text').value = headerCell.textContent.trim();
                document.getElementById('guide-url').value = '';
            }

            // 2) 상단 정보: 이미지 / 딜량 / 캐릭터 / 별 / 랭크 / CR / TP
            if (bodyRows.length < 2) {
                throw new Error('출력 테이블의 캐릭터 정보 영역을 찾지 못했습니다.');
            }

            const imageRow = bodyRows[0];
            const infoRow = bodyRows[1];

            const imageCells = Array.from(imageRow.children);
            const infoCells = Array.from(infoRow.children);

            // 보스 이미지
            const bossImg = imageCells[0]?.querySelector('img');
            const bossImgEl = document.getElementById('img-boss');
            const bossLabelEl = document.getElementById('boss-label');

            if (bossImg && bossImg.getAttribute('src')) {
                bossImgEl.src = bossImg.getAttribute('src');
                bossImgEl.style.display = 'block';
                bossLabelEl.style.display = 'none';
                selectedBossName = '';
            } else {
                bossImgEl.src = '';
                bossImgEl.style.display = 'none';
                bossLabelEl.style.display = 'block';
                selectedBossName = '';
            }

            // 딜량
            if (infoCells[0]) {
                document.getElementById('dmg-input').value = infoCells[0].textContent.trim();
            }

            // 캐릭터 이름 + 이미지
            for (let i = 1; i <= 5; i++) {
                const nameCell = infoCells[i];
                const name = nameCell ? nameCell.textContent.trim() : '';
                document.getElementById(`c${i}`).value = name;

                const importedImg = imageCells[i]?.querySelector('img');
                const imgSrc = importedImg ? (importedImg.getAttribute('src') || '') : '';

                // 별/랭크/CR은 아래 행에서 채운다.
                updateCharInfo(i);

                // 완성 HTML에 들어 있던 실제 이미지 주소를 우선 보존한다.
                // 캐릭터 이름/별에 따라 자동 생성되는 주소와 다를 수도 있기 때문이다.
                const charImgEl = document.getElementById(`img-c${i}`);
                if (imgSrc) {
                    charImgEl.src = imgSrc;
                    charImgEl.style.display = 'block';
                } else {
                    charImgEl.src = '';
                    charImgEl.style.display = 'none';
                }
            }

            // 3) ⭐ / RANK / CR 행은 라벨을 찾아 유연하게 복원한다.
            for (let rowIndex = 2; rowIndex < Math.min(bodyRows.length, 7); rowIndex++) {
                const row = bodyRows[rowIndex];
                const cells = Array.from(row.children);
                if (!cells.length) continue;

                const label = cells[0].textContent.trim().toUpperCase();

                if (label === '⭐' || label === '★') {
                    for (let i = 1; i <= 5; i++) {
                        document.getElementById(`star${i}`).value =
                            cells[i]?.textContent.trim() || '';
                    }
                } else if (label === 'RANK') {
                    for (let i = 1; i <= 5; i++) {
                        document.getElementById(`rank${i}`).value =
                            cells[i]?.textContent.trim() || '';
                    }
                } else if (label === 'CR') {
                    for (let i = 1; i <= 5; i++) {
                        document.getElementById(`cr${i}`).value =
                            cells[i]?.textContent.trim() || '';
                    }
                }
            }

            // 별/이름에 의해 자동 생성되는 이미지가 다시 덮어쓰지 않도록
            // 이미지 주소는 마지막에 한 번 더 원본 값으로 복원한다.
            for (let i = 1; i <= 5; i++) {
                updateCharInfo(i);
                const importedImg = imageCells[i]?.querySelector('img');
                const imgSrc = importedImg ? (importedImg.getAttribute('src') || '') : '';
                const charImgEl = document.getElementById(`img-c${i}`);
                if (imgSrc) {
                    charImgEl.src = imgSrc;
                    charImgEl.style.display = 'block';
                } else {
                    charImgEl.src = '';
                    charImgEl.style.display = 'none';
                }
            }

            // 4) TP 행 찾기
            let tpFound = '';
            for (const row of bodyRows) {
                const cells = Array.from(row.children);
                if (cells.length >= 2 &&
                    cells[0].getAttribute('colspan') === '4' &&
                    cells[1].textContent.trim().toUpperCase() === 'SET' &&
                    cells[2]?.textContent.trim().toUpperCase() === 'AUTO') {
                    tpFound = cells[0].textContent.trim();
                    break;
                }
            }

            if (tpFound) {
                tpFound = tpFound.replace(/^TP\s*/i, '').trim();
            }
            document.getElementById('tp-input').value = tpFound;

            // 5) 타임라인 복원
            const timelineBody = document.querySelector('#timeline-table tbody');
            timelineBody.innerHTML = '';

            let timelineStarted = false;

            // 상단 메타 행 개수에 의존하지 않고,
            // "Set / Auto" 헤더 다음부터 실제 타임라인으로 인식한다.
            for (const row of bodyRows) {
                const cells = Array.from(row.children);
                if (!cells.length) continue;

                const isHeaderRow =
                    cells.length >= 3 &&
                    cells[0].getAttribute('colspan') === '4' &&
                    cells[1].textContent.trim().toUpperCase() === 'SET' &&
                    cells[2].textContent.trim().toUpperCase() === 'AUTO';

                if (isHeaderRow) {
                    timelineStarted = true;
                    continue;
                }

                if (!timelineStarted) continue;

                // 설명행: colspan="6"
                if (cells.length === 1 && cells[0].getAttribute('colspan') === '6') {
                    const noteText = cells[0].textContent.trim();
                    const noteData = {
                        rowType: 'note',
                        time: '',
                        action: noteText
                    };

                    const timeMatch = noteText.match(/^(\d{1,2}:\d{2})\s+([\s\S]*)$/);
                    if (timeMatch) {
                        noteData.time = timeMatch[1];
                        noteData.action = timeMatch[2].trim();
                    }

                    timelineBody.appendChild(createTimelineRow(noteData));
                    continue;
                }

                // 빈 행: colspan 4 + 빈 Set + 빈 Auto
                if (
                    cells.length >= 3 &&
                    cells[0].getAttribute('colspan') === '4' &&
                    !cells[0].textContent.trim() &&
                    !cells[1].textContent.trim() &&
                    !cells[2].textContent.trim()
                ) {
                    timelineBody.appendChild(createTimelineRow({
                        rowType: 'empty',
                        time: '',
                        action: ''
                    }));
                    continue;
                }

                // 정상 행: 내용 / SET / Auto
                if (
                    cells.length >= 3 &&
                    cells[0].getAttribute('colspan') === '4'
                ) {
                    const rawText = cells[0].textContent.replace(/\r/g, '').trim();
                    const setText = cells[1].textContent.trim().toUpperCase();
                    const autoText = cells[2].textContent.trim().toUpperCase();

                    if (!/^[OX]{5}$/.test(setText)) {
                        continue;
                    }

                    let time = '';
                    let action = rawText;

                    const timeMatch = rawText.match(/^(\d{1,2}:\d{2})\s+([\s\S]*)$/);
                    if (timeMatch) {
                        time = timeMatch[1];
                        action = timeMatch[2].trim();
                    }

                    timelineBody.appendChild(createTimelineRow({
                        rowType: 'normal',
                        time: time,
                        action: action,
                        autoVal: autoText === 'ON' ? 'ON' : 'OFF',
                        setStates: setText.split('')
                    }));
                }
            }

            // 현재 입력 상태도 첫 행의 상태에 맞춰준다.
            const normalRows = timelineBody.querySelectorAll('tr[data-row-type="normal"]');
            if (normalRows.length) {
                const lastRow = normalRows[normalRows.length - 1];
                const lastTds = lastRow.querySelectorAll('td');
                document.getElementById('auto-input').value =
                    lastTds[2].textContent.trim() || 'OFF';

                for (let i = 0; i < 5; i++) {
                    toggleSet(i, lastTds[3 + i].textContent.trim().toUpperCase());
                }
            } else {
                document.getElementById('auto-input').value = 'OFF';
                setCurrentSetStates(['O', 'O', 'O', 'O', 'O']);
            }

            document.getElementById('time-input').value = '';
            document.getElementById('start-char-input').value = '';
            document.getElementById('action-input').value = '';

            recalculateChanges();
            renderFinalPreview();
            saveToLocalStorage();

            alert(`${normalRows.length}개의 타임라인 행을 불러왔습니다.`);
        }

        function copyToClipboard() {
            const htmlCode = buildFinalHTML();
            navigator.clipboard.writeText(htmlCode).then(() => {
                alert('완성된 HTML 테이블 코드가 클립보드에 복사되었습니다!');
            }).catch(err => {
                alert('복사 중 오류가 발생했습니다.');
            });
        }

        function clearAll() {
            if (confirm('작성한 전체 내용을 삭제하시겠습니까?')) {
                document.querySelector('#timeline-table tbody').innerHTML = '';
                cancelEdit();
                renderFinalPreview();
            }
        }

        ['guide-text', 'guide-url', 'dmg-input', 'tp-input'].forEach(id => {
            document.getElementById(id).addEventListener('input', saveToLocalStorage);
        });
        for (let i = 1; i <= 5; i++) {
            ['rank', 'cr'].forEach(prefix => {
                document.getElementById(`${prefix}${i}`).addEventListener('input', saveToLocalStorage);
            });
        }
        function resetAllData() {
        if (confirm("모든 타임라인 데이터가 삭제됩니다. 정말 초기화하시겠습니까?")) {
            // 1. 저장된 데이터 삭제 (localStorage 사용 시)
            localStorage.clear();

            // 2. 폼 필드 및 UI 요소 초기화 (프로젝트 구조에 맞게 수정)
            // document.getElementById('timeline-form').reset();
            
            // 3. 페이지 새로고침 또는 상태 재설정
            location.reload();
        }
        }
        initBossModal();
        loadFromLocalStorage(); // 저장된 데이터 먼저 로드
        renderFinalPreview();
    </script>
    <script>
        function addSP(e) {
  // 클릭 순간 버튼으로 포커스가 넘어가는 것 방지 (중요!)
  if (e) e.preventDefault();

  const focused = document.activeElement;

  if (focused && (focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA')) {
    focused.value += 'SP';
  } else if (focused && focused.isContentEditable) {
    focused.innerText += 'SP';
  }
}
        </script>
