<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공략 메인</title>
  <style>
/* 1. 페이지 전체 기본 설정 */
body {
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch; /* 자식 요소들이 너비를 100% 채우도록 설정 */
  justify-content: flex-start; /* 상단 정렬 고정 */
  width: 100%;
}

/* 2. 상단 탭 바 고정 및 너비 설정 */
.tab-bar {
  width: 100%;
  display: flex;
  justify-content: flex-start; /* 탭 버튼 왼쪽 정렬 */
  border-bottom: 2px solid #ccc;
  background-color: #ffffff;
  box-sizing: border-box;
  padding: 8px 16px; /* 탭 바 내부에 여백 추가 */
  
  /* 스크롤 시에도 최상단 고정 (선택 사항) */
  position: sticky;
  top: 0;
  z-index: 1000;
}

/* 3. 본문 컨테이너 (너비 제한 제거) */
#tab-content-area {
  width: 100%;
  box-sizing: border-box;
  padding: 16px; /* 본문 여백 */
}
/* css: 서브 페이지 버튼 스타일의 영향을 받지 않도록 고정 */
.main-tab-btn {
  /* 기본 버튼 스타일 초기화 (외부 CSS 영향 차단) */
  all: unset;
  
  /* 메인 탭 전용 스타일 작성 */
  display: inline-block;
  padding: 10px 20px;
  background-color: #f1f3f5;
  color: #333;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  box-sizing: border-box;
}

.main-tab-btn.active {
  background-color: #3182ce;
  color: #ffffff;
}
  </style>
</head>
<body>


  <!-- 탭 메뉴 영역 -->
  <div class="tab-bar">
      <div class="main-tab-bar">
  <button class="main-tab-btn active" onclick="switchTab(this, 'semi_auto.html')">세미오토</button>
  <button class="main-tab-btn" onclick="switchTab(this, 'full_auto.html')">풀오토</button>
  <button class="main-tab-btn" onclick="switchTab(this, 'recruits.html')">채용시트</button>
</div>

  </div>

  <!-- 외부 파일 내용이 불러와질 컨테이너 -->
  <div id="tab-content-area"></div>

  <script>
  async function loadPage(fileUrl) {
    const container = document.getElementById('content-container');
    try {
      // 상대 경로 구분을 위해 ./ 추가
      const response = await fetch('./' + fileUrl);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      const html = await response.text();
      container.innerHTML = html;

      // 동적으로 주입된 HTML 내부의 script 태그 재실행 처리
      const scripts = container.getElementsByTagName('script');
      for (let i = 0; i < scripts.length; i++) {
        eval(scripts[i].innerText);
      }
    } catch (err) {
      console.error('페이지 로드 실패:', err);
      container.innerHTML = `<div style="padding: 20px; color: red;">페이지를 불러오는 데 실패했습니다. (${err.message})</div>`;
    }
  }

  function switchTab(buttonEl, fileUrl) {
    const buttons = document.querySelectorAll('.main-tab-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    buttonEl.classList.add('active');
    loadPage(fileUrl);
  }

  // 첫 화면 로드
  window.addEventListener('DOMContentLoaded', () => {
    loadPage('semi_auto.html');
  });
</script>
</body>
</html>
