<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiAutoSheet</title>
  <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
  <style>
    .tab-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .main-tab-btn { padding: 8px 16px; cursor: pointer; border: 1px solid #ccc; background: #fff; }
    .main-tab-btn.active { background: #007bff; color: #fff; font-weight: bold; border-color: #007bff; }
    #content-container { min-height: 400px; padding: 12px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <div class="tab-bar">
    <button type="button" class="main-tab-btn active" onclick="switchTab(event, this, 'semi_auto.html')">세미오토</button>
    <button type="button" class="main-tab-btn" onclick="switchTab(event, this, 'full_auto.html')">풀오토</button>
    <button type="button" class="main-tab-btn" onclick="switchTab(event, this, 'recruits.html')">채용시트</button>
  </div>

  <div id="content-container">페이지를 로딩 중입니다...</div>

  <script>
    function loadPage(fileUrl) {
      console.log('loadPage 시작:', fileUrl);
      const container = document.getElementById('content-container');
      if (!container) return;

      fetch(fileUrl)
        .then(response => {
          console.log('Fetch response:', response.status);
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.text();
        })
        .then(html => {
          container.innerHTML = html;
          // script 태그 재실행
          const scripts = Array.from(container.querySelectorAll('script'));
          scripts.forEach(oldScript => {
            const newScript = document.createElement('script');
            Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
            newScript.appendChild(document.createTextNode(oldScript.innerHTML));
            oldScript.parentNode.replaceChild(newScript, oldScript);
          });
        })
        .catch(err => {
          console.error('Fetch 에러:', err);
          container.innerHTML = '<div style="color:red; padding:20px;">불러오기 실패: ' + err.message + '</div>';
        });
    }

    function switchTab(evt, buttonEl, fileUrl) {
      if (evt) evt.preventDefault();
      const buttons = document.querySelectorAll('.main-tab-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      buttonEl.classList.add('active');
      loadPage(fileUrl);
    }

    // DOMContentLoaded 및 즉시 실행 이중 보장
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => loadPage('semi_auto.html'));
    } else {
      loadPage('semi_auto.html');
    }
  </script>
</body>
</html>
